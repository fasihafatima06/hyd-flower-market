<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="See today's Gudimalkapur wholesale flower market without the trip.">
  <title>Gudimalkapur Today</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .bar-reset{margin-left:12px;background:transparent;color:#f8f5ec;border:1px solid #718077;padding:4px 8px;font-size:10px}
    .back-btn{color:var(--coral-dark)!important}
    .market-layout{display:grid;grid-template-columns:215px 1fr;gap:30px;align-items:start}
    .flower-index{position:sticky;top:105px;max-height:calc(100vh - 125px);overflow:auto;border-right:1px solid var(--line);padding-right:15px}
    .flower-index-link{display:flex;justify-content:space-between;width:100%;padding:8px 4px;border-bottom:1px solid #eeeae0;background:transparent;text-align:left;color:var(--muted);font-size:12px}
    .flower-index-link span{font-size:10px;color:#a1aaa1}.flower-index-link:hover,.flower-index-link.active{color:var(--coral-dark);font-weight:700}
    .selection-note{background:var(--sage);padding:10px 13px;color:#47705a;font-size:11px;margin:0 0 18px}
    .summary-panel > button[data-view="seller-orders"]{display:none}
    .landing-page{min-height:100vh;background:var(--paper);color:var(--ink)}
    .landing-header{padding-top:42px;display:flex;align-items:center;justify-content:space-between}
    .landing-header .brand-mark{background:#2f7258;color:#f3d783;width:47px;height:47px;font-size:23px}
    .landing-header .brand strong{font-size:18px}.landing-header .brand small{font-size:10px;letter-spacing:.11em}
    .landing-reset{border:1px solid var(--line);background:transparent;color:var(--muted);padding:9px 12px;font-size:11px}
    .landing-hero{padding-top:105px;padding-bottom:28px}.landing-hero .eyebrow{color:#6e877c;font-size:13px;letter-spacing:.16em;margin-bottom:25px}
    .landing-hero h1{font:500 clamp(58px,8vw,108px)/.91 var(--serif);letter-spacing:-.06em;max-width:800px;margin:0 0 30px}
    .landing-hero h1 em{color:var(--coral-dark)}.landing-lede{color:#70847a;font-size:17px;line-height:1.65;margin-bottom:34px}
    .role-cards{display:grid;gap:15px;max-width:660px}.role-card{min-height:94px;border:1px solid #dedbce;background:var(--white);display:grid;grid-template-columns:55px 1fr 30px;align-items:center;text-align:left;padding:16px 20px;gap:15px;color:var(--ink);transition:.2s ease}.role-card:hover{transform:translateX(3px);box-shadow:0 8px 20px #3a4d4212}.role-card--seller{background:#2f7258;color:white;border-color:#2f7258}.role-icon{display:grid;place-items:center;width:53px;height:53px;background:#f1d184;color:#2f7258;font-size:29px}.role-card strong,.role-card small{display:block}.role-card strong{font-size:17px}.role-card small{color:#7a8980;font-size:13px;margin-top:3px}.role-card--seller small{color:#c8ddd0}.role-arrow{font-size:28px;color:#71847a;text-align:right}.role-card--seller .role-arrow{color:#dbe9de}.landing-location{display:flex;align-items:center;gap:10px;color:#6f8379;font-size:13px;letter-spacing:.04em;margin-top:64px}.landing-location i{font-style:normal;color:#c2a56c}
    .role-landing{min-height:calc(100vh - 110px);display:grid;place-items:center;text-align:center;padding:70px 0}
    .role-copy{max-width:700px;margin:auto}.role-copy .eyebrow{margin-bottom:18px}.role-copy h1{font:500 clamp(44px,6vw,72px)/1 var(--serif);letter-spacing:-.04em;margin:0 0 22px}.role-copy .lede{margin:0 auto 10px;max-width:600px}.role-copy .actions{justify-content:center;margin-top:30px}
    @media(max-width:700px){.market-layout{display:block}.flower-index{position:static;max-height:220px;border-right:0;border-bottom:1px solid var(--line);padding:0 0 12px;margin-bottom:18px;display:grid;grid-template-columns:1fr 1fr;column-gap:18px}.flower-index .eyebrow{grid-column:1/-1;margin:0 0 7px}.bar-reset{margin-left:auto}.top-nav{max-height:80vh;overflow:auto}.landing-header{padding-top:27px}.landing-hero{padding-top:85px}.landing-hero h1{font-size:58px}.landing-lede{font-size:15px}.role-card{min-height:84px;padding:12px 14px}.role-icon{width:46px;height:46px}.landing-location{margin-top:52px;font-size:11px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
